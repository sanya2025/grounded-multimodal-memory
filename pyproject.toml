[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-multimodal-memory"
version = "0.1.0"
description = "Grounded Multimodal Scene Memory: visual evidence, temporal retrieval, and efficient multimodal reasoning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sanja Damjanovic" }]
keywords = [
    "multimodal", "vision-language-models", "grounding", "hallucination",
    "episodic-memory", "retrieval", "temporal-reasoning", "evaluation",
]

# Base install is intentionally light. Heavy / hardware-specific packages
# (torch, transformers, faiss, bitsandbytes) live in optional extras so that
# tests and metric code can run without GPUs or large downloads.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "Pillow>=10.0",
]

[project.optional-dependencies]
models = [
    "torch>=2.2",
    "transformers>=4.49",
    "accelerate>=0.30",
]
retrieval = [
    "faiss-cpu>=1.8",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
viz = [
    "matplotlib>=3.7",
]
quant = [
    "bitsandbytes>=0.43; platform_system == 'Linux'",
]
tracking = [
    "mlflow>=2.12",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbformat>=5.9",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
# Convenience meta-extra for a full local research environment.
all = [
    "grounded-multimodal-memory[models,retrieval,api,viz,tracking,notebooks,dev]",
]

[project.urls]
Homepage = "https://github.com/your-username/grounded-multimodal-memory"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: tests that require a GPU / large model download (deselected by default)",
    "integration: end-to-end tests across multiple components",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
